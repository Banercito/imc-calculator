<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora IMC</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

/* CONTENEDOR */
.card{
background:white;
padding:25px;
border-radius:15px;
width:100%;
max-width:400px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* TITULO */
h2{
text-align:center;
margin-bottom:15px;
}

/* INPUTS */
input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
}

/* BOTON */
button{
width:100%;
padding:14px;
background:#667eea;
border:none;
color:white;
font-weight:bold;
border-radius:10px;
cursor:pointer;
font-size:16px;
margin-top:10px;
}

button:hover{
background:#5a67d8;
}

/* RESULTADOS */
.resultado{
margin-top:15px;
text-align:center;
}

.resultado p{
margin:5px 0;
}

/* BARRA */
.barra{
background:#eee;
height:20px;
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.progreso{
height:100%;
transition:0.5s;
}

/* 📱 RESPONSIVE */
@media (max-width: 480px){

.card{
padding:20px;
border-radius:12px;
}

h2{
font-size:20px;
}

input{
padding:10px;
font-size:13px;
}

button{
padding:12px;
font-size:14px;
}

}

</style>

</head>

<body>

<div class="card">

<h2>Entrevista IMC</h2>

<form method="POST">

<input name="nombre" placeholder="Nombre" required>

<label>Fecha de nacimiento</label>
<input type="text" id="fecha" name="fecha" placeholder="DD/MM/YYYY" required>

<input name="pais" placeholder="País" required>

<input name="peso" placeholder="Peso (kg)" required>

<input name="altura" placeholder="Altura (m)" required>

<button>Calcular</button>

</form>

{% if resultado %}

<div class="resultado">

<h3>{{resultado}}</h3>

<p>{{mensaje_imc}}</p>
<p><b>Edad:</b> {{edad}}</p>
<p><b>Signo:</b> {{signo}}</p>
<p>{{mensaje_pais}}</p>
<p><b>Fecha actual:</b> {{fecha}}</p>

<div class="barra">
<div class="progreso" style="width:{{porcentaje}}%; background:{{color}};"></div>
</div>

</div>

{% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
flatpickr("#fecha",{
dateFormat:"d/m/Y",
locale:"es"
})
</script>

</body>
</html>
